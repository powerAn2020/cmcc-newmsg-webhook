services:
  cmcc-webhook:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cmcc-webhook
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - TZ=Asia/Shanghai
