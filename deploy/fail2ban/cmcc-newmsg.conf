# Fail2ban Filter for cmcc-newmsg-webhook
# 适用于 NDJSON (单行 JSON) 格式日志
#
# 攻击行为判定：
# 1. 认证鉴权失败拦截（密码错误 login_failed，或接口与健康检查无效凭据 invalid_*，涵盖 401/404）
# 2. 频率超限或应用层封禁拦截（HTTP 429）

[Definition]
failregex = ^\{.*?"ip":"<HOST>".*?"authType":"(?:invalid_[^"]+|login_failed)"
            ^\{.*?"ip":"<HOST>".*?"statusCode":429

# 仅忽略未提供任何凭据的无害健康检查探针（authType 必须为 none）
ignoreregex = ^\{.*?"ip":"<HOST>".*?"url":"/healthz[^"]*".*?"statusCode":404.*?"authType":"none"
